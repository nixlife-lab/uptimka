# Конфигурация uptimka — https://github.com/nixlife-lab/uptimka
# Файл: /etc/uptimka/uptimka.conf. После правки ничего перезапускать не нужно.

# Telegram
BOT_TOKEN="YOUR_BOT_TOKEN_HERE"
CHAT_ID="YOUR_CHAT_ID_HERE"

# Если api.telegram.org с сервера недоступен — прокси (socks5h://IP:порт или http://IP:порт)
TG_PROXY=""
# Свой адрес Bot API (например, reverse-proxy на VPS); по умолчанию — официальный
TG_API_URL="https://api.telegram.org"

# Пороги алертов, %
CPU_THRESHOLD=85
RAM_THRESHOLD=90
DISK_THRESHOLD=90

# Точки монтирования для проверки, через пробел (например "/ /mnt/data")
DISKS="/"

# Повторный алерт при затянувшейся проблеме — не чаще, чем раз в N секунд (3600 = 1 час)
ALERT_COOLDOWN=3600

# Сообщать, когда всё вернулось в норму
SEND_RESOLVE_ALERT=true

# Сообщать о перезагрузке сервера
NOTIFY_REBOOT=true

# Docker: auto — проверять, если установлен; off — не проверять совсем
DOCKER="auto"
# Docker-контейнеры, которые не нужно проверять (имена через пробел)
DOCKER_IGNORE=""

# Регулярный отчёт о состоянии сервера: off / hourly / daily / weekly
# (алерты о проблемах и восстановлении приходят независимо от отчёта)
REPORT="daily"
# Во сколько присылать daily/weekly — по часам сервера (проверить: date)
REPORT_TIME="09:00"
# День недели для weekly: 1 — пн … 7 — вс
REPORT_DAY=1

# Proxmox VE (работает на хосте Proxmox): auto / off
PROXMOX="auto"
# Какие VM/LXC проверять — ID через пробел; пусто — все
PROXMOX_GUESTS=""
# Кого не проверять (например, тестовые машины)
PROXMOX_IGNORE=""
# Порог RAM для гостей, %
GUEST_RAM_THRESHOLD=95
# Порог заполнения хранилищ Proxmox, % и хранилища-исключения
STORAGE_THRESHOLD=90
STORAGE_IGNORE=""
# Предупреждать, если последнему бэкапу гостя больше N дней (0 — не следить)
BACKUP_MAX_AGE_DAYS=0

# Здоровье и износ SSD/NVMe через smartctl: auto / off
SMART="auto"
# Предупреждать, когда износ SSD достигнет, %
SSD_WEAR_THRESHOLD=80
