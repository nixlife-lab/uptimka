# Конфигурация uptimka — https://github.com/nixlife-lab/uptimka
# Файл: /etc/uptimka/uptimka.conf. После правки ничего перезапускать не нужно.

# Telegram
BOT_TOKEN="YOUR_BOT_TOKEN_HERE"
CHAT_ID="YOUR_CHAT_ID_HERE"

# Пороги алертов, %
CPU_THRESHOLD=85
RAM_THRESHOLD=90
DISK_THRESHOLD=90

# Точки монтирования для проверки, через пробел (например "/ /mnt/data")
DISKS="/"

# Повторный алерт при затянувшейся проблеме — не чаще, чем раз в N секунд (3600 = 1 час)
ALERT_COOLDOWN=3600

# Сообщать, когда всё вернулось в норму
SEND_RESOLVE_ALERT=true

# Сообщать о перезагрузке сервера
NOTIFY_REBOOT=true

# Docker-контейнеры, которые не нужно проверять (имена через пробел)
DOCKER_IGNORE=""

# Регулярный отчёт о состоянии сервера: off / hourly / daily / weekly
# (алерты о проблемах и восстановлении приходят независимо от отчёта)
REPORT="daily"
# Во сколько присылать daily/weekly — по часам сервера (проверить: date)
REPORT_TIME="09:00"
# День недели для weekly: 1 — пн … 7 — вс
REPORT_DAY=1
