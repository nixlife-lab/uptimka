# Конфигурация nix-monitor
# https://github.com/Flyerrs/nix-monitor

# Telegram Credentials
BOT_TOKEN="YOUR_BOT_TOKEN_HERE"
CHAT_ID="YOUR_CHAT_ID_HERE"

# Пороги срабатывания алертов (в процентах)
CPU_THRESHOLD=85
RAM_THRESHOLD=90
DISK_THRESHOLD=90

# Кулдаун между повторными алертами в секундах (3600 = 1 час)
ALERT_COOLDOWN=3600

# Отправлять ли отчет о нормализации метрик
SEND_RESOLVE_ALERT=true
